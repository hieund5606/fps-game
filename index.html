<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>FPS 3D - Three.js r160</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
  canvas#gameCanvas { display: block; width: 100%; height: 100%; }

  /* ============ HUD TRONG GAME ============ */
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 10; }

  #crosshair { position: absolute; top: 50%; left: 50%; width: 24px; height: 24px; transform: translate(-50%, -50%); }
  #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #00ff66; }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
  #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
  #crosshair .dot { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: #00ff66; border-radius: 50%; transform: translate(-50%,-50%); }

  #topLeftHud { position: absolute; top: 16px; left: 16px; color: #fff; text-shadow: 2px 2px 3px rgba(0,0,0,0.8); }
  #score { font-size: 24px; font-weight: bold; color: #ffd700; }
  #levelInfo { font-size: 16px; margin-top: 4px; color: #9fe; }
  #enemyCount { font-size: 14px; margin-top: 2px; color: #ccc; }

  #heartsWrap { position: absolute; bottom: 25px; left: 25px; display: flex; gap: 4px; }
  .heart { font-size: 28px; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.7)); }
  .heart.empty { opacity: 0.25; }

  #weaponHud { position: absolute; bottom: 25px; right: 25px; text-align: right; color: #fff; text-shadow: 2px 2px 3px rgba(0,0,0,0.8); }
  #weaponName { font-size: 20px; font-weight: bold; color: #ffcc00; letter-spacing: 1px; }
  #ammoCount { font-size: 34px; font-weight: bold; }
  #ammoMax { font-size: 16px; color: #aaa; }
  #reloadHint { font-size: 13px; color: #ffcc00; margin-top: 2px; min-height: 16px; }

  #minimapWrap {
    position: absolute; top: 16px; right: 16px; width: 150px; height: 150px;
    border: 2px solid rgba(255,255,255,0.5); border-radius: 8px; overflow: hidden;
    background: rgba(20,20,20,0.6);
  }
  #minimapCanvas { width: 100%; height: 100%; display: block; }

  #hitFlash { position: fixed; inset: 0; background: rgba(255,0,0,0.25); opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 9; }
  #zoomVignette { position: fixed; inset: 0; pointer-events: none; z-index: 8; display: none; background: radial-gradient(circle, transparent 30%, #000 68%); }
  #levelBanner {
    position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
    font-size: 40px; color: #fff; text-shadow: 3px 3px 6px #000; opacity: 0;
    transition: opacity 0.5s; z-index: 15; pointer-events: none; text-align: center;
  }

  /* ============ OVERLAY DÙNG CHUNG ============ */
  .overlay {
    position: fixed; inset: 0; background: rgba(8,8,16,0.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; z-index: 20; text-align: center;
  }
  .overlay h1 { font-size: 46px; margin-bottom: 12px; letter-spacing: 2px; }
  .overlay p { font-size: 16px; color: #ccc; margin-bottom: 20px; max-width: 520px; line-height: 1.6; }
  .btn {
    padding: 13px 38px; font-size: 18px; font-weight: bold; margin: 6px;
    background: linear-gradient(90deg, #00c853, #00e676);
    border: none; border-radius: 8px; color: #000; cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4); transition: transform 0.1s; pointer-events: all;
  }
  .btn:hover { transform: scale(1.05); }
  .btn:disabled { background: #555; color: #999; cursor: not-allowed; transform: none; }
  .btn.secondary { background: linear-gradient(90deg, #607d8b, #78909c); }
  .btn.danger { background: linear-gradient(90deg, #d32f2f, #f44336); color: #fff; }
  #gameOverScreen h1 { color: #ff4444; }
  #winScreen h1 { color: #ffd700; }
  .hidden { display: none !important; }
  #finalScore, #winScore { font-size: 20px; color: #ffd700; margin-bottom: 16px; }

  #settingsScreen .settingRow { display: flex; align-items: center; gap: 14px; width: 380px; margin: 12px 0; }
  #settingsScreen label { width: 150px; text-align: left; }
  #settingsScreen input[type=range] { flex: 1; }
  #settingsScreen .val { width: 40px; text-align: right; color: #9fe; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- ============ MENU CHÍNH ============ -->
<div id="menuScreen" class="overlay">
  <h1>🎯 FPS 3D SHOOTER</h1>
  <p>
    WASD: di chuyển · Chuột: xoay góc nhìn · Click trái: bắn · Giữ chuột phải: zoom (sniper)<br>
    Phím 1/2/3: đổi súng (Súng lục / Shotgun / Sniper) · R: nạp đạn · Space: nhảy
  </p>
  <button class="btn" id="newGameBtn">▶ CHƠI MỚI</button>
  <button class="btn secondary" id="continueBtn">⏵ TIẾP TỤC</button>
  <button class="btn secondary" id="settingsBtn">⚙ CÀI ĐẶT</button>
  <button class="btn danger" id="exitBtn">✖ THOÁT</button>
</div>

<!-- ============ CÀI ĐẶT ============ -->
<div id="settingsScreen" class="overlay hidden">
  <h1>⚙ CÀI ĐẶT</h1>
  <div class="settingRow">
    <label>Âm lượng</label>
    <input type="range" id="volumeSlider" min="0" max="100" value="60">
    <span class="val" id="volumeVal">60%</span>
  </div>
  <div class="settingRow">
    <label>Độ nhạy chuột</label>
    <input type="range" id="sensSlider" min="10" max="300" value="100">
    <span class="val" id="sensVal">1.0x</span>
  </div>
  <button class="btn" id="settingsBackBtn">⬅ QUAY LẠI</button>
</div>

<!-- ============ GAME OVER ============ -->
<div id="gameOverScreen" class="overlay hidden">
  <h1>☠ GAME OVER</h1>
  <div id="finalScore"></div>
  <button class="btn" id="restartBtn">↻ CHƠI LẠI</button>
  <button class="btn secondary" id="backToMenuBtn">⬅ VỀ MENU</button>
</div>

<!-- ============ CHIẾN THẮNG ============ -->
<div id="winScreen" class="overlay hidden">
  <h1>🏆 CHIẾN THẮNG!</h1>
  <div id="winScore"></div>
  <button class="btn" id="winRestartBtn">↻ CHƠI LẠI</button>
  <button class="btn secondary" id="winBackToMenuBtn">⬅ VỀ MENU</button>
</div>

<!-- ============ HUD TRONG GAME ============ -->
<div id="hud">
  <div id="crosshair"><div class="dot"></div></div>

  <div id="topLeftHud">
    <div id="score">Điểm: 0</div>
    <div id="levelInfo">Màn: 1/3</div>
    <div id="enemyCount">Địch còn lại: 0</div>
  </div>

  <div id="heartsWrap"></div>

  <div id="weaponHud">
    <div id="weaponName">SÚNG LỤC</div>
    <div><span id="ammoCount">30</span> <span id="ammoMax">/ 30</span></div>
    <div id="reloadHint"></div>
  </div>

  <div id="minimapWrap"><canvas id="minimapCanvas" width="150" height="150"></canvas></div>

  <div id="levelBanner"></div>
</div>

<div id="hitFlash"></div>
<div id="zoomVignette"></div>

<!-- ============ IMPORTMAP THREE.JS r160 (BẮT BUỘC ĐẶT TRƯỚC SCRIPT MODULE) ============ -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module" src="main.js"></script>
</body>
</html>
